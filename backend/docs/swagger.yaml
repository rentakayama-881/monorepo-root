          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove tag from case
      tags:
