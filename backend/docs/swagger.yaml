        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Add tags to case
      tags:
      - ValidationCases
  /validation-cases/{id}/tags/{tagSlug}:
