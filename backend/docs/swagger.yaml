host: api.aivalid.id
info:
  contact:
    name: AIValid Support
    url: https://aivalid.id/contact-support
  description: API untuk platform validasi hasil kerja AI oleh ahli manusia.
  license:
    name: Proprietary
  termsOfService: https://aivalid.id/rules-content
  title: AIValid API
  version: "1.0"
paths:
  /account:
    delete:
      consumes:
      - application/json
      description: Permanently delete the authenticated user's account. Requires active
        sudo session (identity re-verification). Validates wallet balance and pending
        transactions before proceeding.
      parameters:
      - description: Confirmation (must be 'DELETE')
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SwaggerDeleteAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerMessageResponse'
        "400":
          description: Validation failed or confirmation incorrect
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "403":
          description: Sudo session required
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "503":
          description: Wallet verification service unavailable
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - Account
    put:
      consumes:
      - application/json
      description: Update profile fields (full_name, bio, pronouns, company, social_accounts)
        for the authenticated user.
      parameters:
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SwaggerUpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user account
      tags:
      - Account
  /account/avatar:
    delete:
      description: Remove the authenticated user's profile avatar.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete avatar
      tags:
      - Account
    put:
      consumes:
      - multipart/form-data
      description: Upload a new profile avatar image. Accepts JPG/PNG up to 2 MB.
      parameters:
      - description: Avatar image file (JPG or PNG, max 2 MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerUploadAvatarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload avatar
      tags:
      - Account
  /account/badges:
    get:
      description: Returns all active badges and primary badge ID for the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerMyBadgesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my badges
      tags:
      - Account
  /account/can-delete:
    get:
      description: Returns whether the authenticated user can delete their account,
        along with any blocking reasons (wallet balance, pending transfers, disputes).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerCanDeleteResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Check if account can be deleted
      tags:
      - Account
  /account/change-username:
    post:
      consumes:
      - application/json
      description: Change the authenticated user's username. The new username must
        be unique.
      parameters:
      - description: New username
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SwaggerChangeUsernameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerChangeUsernameResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "409":
          description: Username already taken
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Change username
      tags:
      - Account
  /account/me:
    get:
      description: Returns profile information for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerAccountMeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user account
      tags:
      - Account
  /account/primary-badge:
    put:
      consumes:
      - application/json
      description: Set or clear the authenticated user's primary (display) badge.
        Send badge_id=null to clear.
      parameters:
      - description: Badge ID to set as primary (null to clear)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SwaggerSetPrimaryBadgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Set primary badge
      tags:
      - Account
  /account/telegram/connect:
    post:
      consumes:
      - application/json
      description: Link a Telegram account to the authenticated user using Telegram
        Login Widget data. The payload is verified against the bot token.
      parameters:
      - description: Telegram login widget payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SwaggerTelegramConnectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SwaggerTelegramConnectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "409":
          description: Telegram account already linked to another user
          schema:
            $ref: '#/definitions/handlers.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
