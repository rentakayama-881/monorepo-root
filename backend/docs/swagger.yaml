securityDefinitions:
  AdminAuth:
    description: Admin JWT token. Type "Bearer" followed by a space and admin JWT
      token.
    in: header
    name: Authorization
    type: apiKey
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
