# =============================================================================
# AIValid - Production Deployment Pipeline
# =============================================================================
# Enterprise-grade deployment following GitHub, Stripe, Supabase patterns
#
# Features:
# - Zero-downtime deployments
# - Health check verification
# - Automatic rollback on failure
# - Deployment notifications
# - Multi-service coordination
#
# VPS Configuration:
# - VPS 1 (Go Backend): Configured via secrets.VPS_BACKEND_HOST
# - VPS 2 (Feature Service): Configured via secrets.VPS_FEATURE_HOST
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'feature-service/**'
      - 'browser-service/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - feature-service
          - browser-service

# Only one deployment at a time
concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  GO_VERSION: "1.24"
  DOTNET_VERSION: "8.0.x"
  PYTHON_VERSION: "3.12"

jobs:
  # ==========================================================================
  # Pre-Deployment Validation
  # ==========================================================================

  validate:
    name: 🔍 Pre-Deployment Validation
    runs-on: ubuntu-latest
    outputs:
      deploy_backend: ${{ steps.changes.outputs.backend }}
      deploy_feature_service: ${{ steps.changes.outputs.feature_service }}
      deploy_browser_service: ${{ steps.changes.outputs.browser_service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          SERVICE_INPUT="${{ github.event.inputs.service }}"

          # Manual run: deploy exactly what is requested.
          if [[ "$SERVICE_INPUT" == "all" ]]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "feature_service=true" >> $GITHUB_OUTPUT
            echo "browser_service=true" >> $GITHUB_OUTPUT
          elif [[ "$SERVICE_INPUT" == "backend" ]]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "feature_service=false" >> $GITHUB_OUTPUT
            echo "browser_service=false" >> $GITHUB_OUTPUT
          elif [[ "$SERVICE_INPUT" == "feature-service" ]]; then
            echo "backend=false" >> $GITHUB_OUTPUT
            echo "feature_service=true" >> $GITHUB_OUTPUT
            echo "browser_service=false" >> $GITHUB_OUTPUT
          elif [[ "$SERVICE_INPUT" == "browser-service" ]]; then
            echo "backend=false" >> $GITHUB_OUTPUT
            echo "feature_service=false" >> $GITHUB_OUTPUT
            echo "browser_service=true" >> $GITHUB_OUTPUT
          else
            # Push event: detect changes across the entire push range, not just HEAD~1..HEAD.
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.sha }}"
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BEFORE_SHA="$(git rev-parse "${AFTER_SHA}^")"
            fi

            echo "Diff range: $BEFORE_SHA..$AFTER_SHA"

            BACKEND_CHANGES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- backend/ | wc -l | tr -d ' ')"
            FS_CHANGES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- feature-service/ | wc -l | tr -d ' ')"
            BS_CHANGES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- browser-service/ | wc -l | tr -d ' ')"

            if [[ "$BACKEND_CHANGES" -gt 0 ]]; then
              echo "backend=true" >> $GITHUB_OUTPUT
            else
              echo "backend=false" >> $GITHUB_OUTPUT
            fi

            if [[ "$FS_CHANGES" -gt 0 ]]; then
              echo "feature_service=true" >> $GITHUB_OUTPUT
            else
              echo "feature_service=false" >> $GITHUB_OUTPUT
            fi

            if [[ "$BS_CHANGES" -gt 0 ]]; then
              echo "browser_service=true" >> $GITHUB_OUTPUT
            else
              echo "browser_service=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Go) | ${{ steps.changes.outputs.backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Service (.NET) | ${{ steps.changes.outputs.feature_service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser Service (Python) | ${{ steps.changes.outputs.browser_service }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Backend Deployment (VPS 1 - Go)
  # ==========================================================================

  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.deploy_backend == 'true'
    environment:
      name: production-backend
      url: https://api.aivalid.id
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X backend-gin/buildinfo.Version=${{ github.sha }}" -o backend-linux-amd64 .
          sha256sum backend-linux-amd64 > backend-linux-amd64.sha256

      - name: Copy binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_BACKEND_HOST }}
          username: ${{ secrets.VPS_BACKEND_USER }}
          key: ${{ secrets.VPS_BACKEND_SSH_KEY }}
          source: "backend/backend-linux-amd64"
          target: "/home/deploy/deploy-staging/"
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_BACKEND_HOST }}
          username: ${{ secrets.VPS_BACKEND_USER }}
          key: ${{ secrets.VPS_BACKEND_SSH_KEY }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e

            echo "=========================================="
            echo "🚀 Starting Backend Deployment"
            echo "=========================================="

            APP_DIR="/home/deploy/monorepo-root/backend"
            STAGING_DIR="/home/deploy/deploy-staging"
            BACKUP_DIR="/home/deploy/backups/$(date +%Y%m%d_%H%M%S)"

            # Create backup
            mkdir -p $BACKUP_DIR
            if [ -f "$APP_DIR/app" ]; then
              cp "$APP_DIR/app" "$BACKUP_DIR/app.backup"
              echo "✅ Backup created: $BACKUP_DIR"
            fi

            # Move new binary into place
            if [ ! -f "$STAGING_DIR/backend-linux-amd64" ]; then
              echo "❌ Binary not found in staging directory"
              exit 1
            fi

            mv "$STAGING_DIR/backend-linux-amd64" "$APP_DIR/app"
            chmod +x "$APP_DIR/app"

            restart_backend_service() {
              for svc in aivalid-backend alephdraad-backend.service backend.service; do
                if sudo systemctl restart "$svc" >/dev/null 2>&1; then
                  if sudo systemctl is-active --quiet "$svc"; then
                    echo "✅ Restarted service: $svc"
                    return 0
                  fi
                fi
              done
              echo "❌ Failed to restart known backend services (aivalid-backend/alephdraad-backend.service/backend.service)"
              return 1
            }

            # Graceful restart
            echo "🔄 Restarting service..."
            restart_backend_service

            # Health check (wait up to 30 seconds)
            echo "🏥 Running health check..."
            for i in {1..30}; do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Health check failed after 30 seconds"
                echo "🔄 Rolling back..."
                cp "$BACKUP_DIR/app.backup" "$APP_DIR/app"
                restart_backend_service
                exit 1
              fi
              sleep 1
            done

            echo "=========================================="
            echo "✅ Backend deployed successfully!"
            echo "=========================================="

      - name: Notify deployment status
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "## ✅ Backend Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Backend Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Feature Service Deployment (VPS 2 - .NET)
  # ==========================================================================

  deploy-feature-service:
    name: 🚀 Deploy Feature Service
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.deploy_feature_service == 'true'
    environment:
      name: production-feature-service
      url: https://feature.aivalid.id
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish application
        run: |
          cd feature-service/src/FeatureService.Api
          dotnet publish -c Release -o ./publish --self-contained false -p:InformationalVersion=${{ github.sha }}

      - name: Copy publish artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_FEATURE_HOST }}
          username: ${{ secrets.VPS_FEATURE_USER }}
          key: ${{ secrets.VPS_FEATURE_SSH_KEY }}
          source: "feature-service/src/FeatureService.Api/publish"
          target: "/home/asp/deploy-staging/"
          strip_components: 3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_FEATURE_HOST }}
          username: ${{ secrets.VPS_FEATURE_USER }}
          key: ${{ secrets.VPS_FEATURE_SSH_KEY }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e

            echo "=========================================="
            echo "🚀 Starting Feature Service Deployment"
            echo "=========================================="

            APP_DIR="/home/asp/monorepo-root/feature-service/publish"
            STAGING_DIR="/home/asp/deploy-staging"
            BACKUP_DIR="/home/asp/backups/$(date +%Y%m%d_%H%M%S)"

            # Create backup
            mkdir -p $BACKUP_DIR
            if [ -d "$APP_DIR" ]; then
              cp -r "$APP_DIR" "$BACKUP_DIR/publish"
              echo "✅ Backup created: $BACKUP_DIR"
            fi

            # Move staged publish artifacts into place
            if [ ! -d "$STAGING_DIR/publish" ]; then
              echo "❌ Publish artifacts not found in staging directory"
              exit 1
            fi

            rm -rf "$APP_DIR"
            cp -r "$STAGING_DIR/publish" "$APP_DIR"

            restart_feature_service() {
              for svc in feature-service.service featureservice.service feature-service; do
                if sudo systemctl restart "$svc" >/dev/null 2>&1; then
                  if sudo systemctl is-active --quiet "$svc"; then
                    echo "✅ Restarted service: $svc"
                    return 0
                  fi
                fi
              done
              echo "❌ Failed to restart known feature-service units (feature-service.service/featureservice.service/feature-service)"
              return 1
            }

            # Graceful restart
            echo "🔄 Restarting service..."
            restart_feature_service

            # Health check (wait up to 60 seconds for .NET warmup)
            echo "🏥 Running health check..."
            for i in {1..60}; do
              if curl -sf http://localhost:5000/api/v1/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                break
              fi
              if [ $i -eq 60 ]; then
                echo "❌ Health check failed after 60 seconds"
                echo "🔄 Rolling back..."
                rm -rf "$APP_DIR"
                cp -r "$BACKUP_DIR/publish" "$APP_DIR"
                restart_feature_service
                exit 1
              fi
              sleep 1
            done

            echo "=========================================="
            echo "✅ Feature Service deployed successfully!"
            echo "=========================================="

      - name: Notify deployment status
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "## ✅ Feature Service Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Feature Service Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Browser Service Deployment (VPS - Python)
  # ==========================================================================

  deploy-browser-service:
    name: 🚀 Deploy Browser Service
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.deploy_browser_service == 'true'
    environment:
      name: production-browser-service
      url: https://browser.aivalid.id
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy browser-service to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_BACKEND_HOST }}
          username: ${{ secrets.VPS_BACKEND_USER }}
          key: ${{ secrets.VPS_BACKEND_SSH_KEY }}
          source: "browser-service/"
          target: "/home/deploy/deploy-staging/"
          strip_components: 0

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_BACKEND_HOST }}
          username: ${{ secrets.VPS_BACKEND_USER }}
          key: ${{ secrets.VPS_BACKEND_SSH_KEY }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e

            echo "=========================================="
            echo "🚀 Starting Browser Service Deployment"
            echo "=========================================="

            APP_DIR="/opt/alephdraad/browser-service"
            STAGING_DIR="/home/deploy/deploy-staging/browser-service"
            BACKUP_DIR="/opt/alephdraad/backups/browser-service-$(date +%Y%m%d_%H%M%S)"

            # Create backup
            mkdir -p "$BACKUP_DIR"
            if [ -d "$APP_DIR" ]; then
              cp -r "$APP_DIR"/*.py "$APP_DIR"/requirements.txt "$BACKUP_DIR/" 2>/dev/null || true
              echo "✅ Backup created: $BACKUP_DIR"
            fi

            # Create app dir if first deploy
            mkdir -p "$APP_DIR"

            # Copy source files
            cp "$STAGING_DIR"/*.py "$APP_DIR/"
            cp "$STAGING_DIR"/requirements.txt "$APP_DIR/"

            # Setup venv if not exists
            if [ ! -d "$APP_DIR/.venv" ]; then
              python3 -m venv "$APP_DIR/.venv"
              echo "✅ Virtual environment created"
            fi

            # Install dependencies
            "$APP_DIR/.venv/bin/pip" install -q -r "$APP_DIR/requirements.txt"
            "$APP_DIR/.venv/bin/python" -m playwright install chromium
            echo "✅ Dependencies installed"

            # Restart service
            echo "🔄 Restarting service..."
            sudo systemctl restart browser-service.service

            # Health check
            echo "🏥 Running health check..."
            for i in {1..30}; do
              if curl -sf http://localhost:6100/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Health check failed after 30 seconds"
                exit 1
              fi
              sleep 1
            done

            echo "=========================================="
            echo "✅ Browser Service deployed successfully!"
            echo "=========================================="

      - name: Notify deployment status
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "## ✅ Browser Service Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Browser Service Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Post-Deployment Verification
  # ==========================================================================

  verify-deployment:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-feature-service, deploy-browser-service]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-feature-service.result == 'success' || needs.deploy-browser-service.result == 'success')
    steps:
      - name: Verify Backend
        if: needs.deploy-backend.result == 'success'
        run: |
          echo "Verifying backend health from external..."
          for i in {1..10}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://api.aivalid.id/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "❌ Backend external health check failed after 10 attempts"
          exit 1

      - name: Verify Feature Service
        if: needs.deploy-feature-service.result == 'success'
        run: |
          echo "Verifying feature service health from external..."
          for i in {1..10}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://feature.aivalid.id/api/v1/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Feature Service is healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "❌ Feature Service external health check failed after 10 attempts"
          exit 1

      - name: Verify Browser Service
        if: needs.deploy-browser-service.result == 'success'
        run: |
          echo "Verifying browser service health from external..."
          for i in {1..10}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://browser.aivalid.id/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Browser Service is healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "❌ Browser Service external health check failed after 10 attempts"
          exit 1

      - name: Generate deployment report
        run: |
          echo "# 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Service | ${{ needs.deploy-feature-service.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
