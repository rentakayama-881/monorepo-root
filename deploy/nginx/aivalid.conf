# Smart Browser Service (Python FastAPI + noVNC WebSocket)
server {
    listen 443 ssl;
    server_name browser.aivalid.id;

    ssl_certificate /etc/letsencrypt/live/api.aivalid.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aivalid.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s;

    # REST API
    location /api/ {
        set $browser_upstream http://browser-service:6100;
        proxy_pass $browser_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        set $browser_upstream http://browser-service:6100;
        proxy_pass $browser_upstream;
    }

    # noVNC WebSocket proxy — dynamic port routing
    location ~ ^/ws/(\d+)$ {
        set $vnc_port $1;
        set $browser_vnc http://browser-service:$vnc_port;
        proxy_pass $browser_vnc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
