global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "go-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: "go-backend"

  - job_name: "feature-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["feature-service:5000"]
        labels:
          service: "feature-service"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9091"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["localhost:9100"]
